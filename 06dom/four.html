<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dom with cofee with code</title>
</head>
<body style="background-color: black; color: antiquewhite;">
    <ul class="language">
        <li>Javascript</li>
        
    </ul>
    
</body>


<script>
    function addLanguage(langName){//this is oe of the menthods to add alnguages 
        const li = document.createElement('li');
        li.innerHTML = `${langName}`// here using inner html yyour whole tree is traversed it not good for large trees 
        document.querySelector('.language').
        appendChild(li)//pura tree traverse hota hai

    }//after this scope the li is not same as following li in script
    addLanguage("python")
    addLanguage("typescript")

    //optimized way to add language use this method insted called append child
    function addOptiLanguage(langName){
        const li = document.createElement('li')
        li.appendChild(document.createTextNode(langName))//easy way save space
        document.querySelector('.language').appendChild(li)
    }   
    addOptiLanguage('golang')

    //EDIT
    const secondLang = document.querySelector("li:nth-child(2)")
    //secondLang.innerHTML = "Mojo" // here traversing problem buddy
    const newli = document.createElement('li')
    newli.textContent = "Mojo"
    secondLang.replaceWith(newli)
    
    //edit
    const firstLang = document.querySelector("li:first-child")
    firstLang.outerHTML = '<li>TypeScript</li>'

    //remove
    const lastLang = document.querySelector('li:last-child')
    lastLang.remove()

 
</script>
</html>
